<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise</title>
  <!-- CryptoJS for AES Decryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #12090d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .screen {
      display: none;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .screen.active {
      display: flex !important;
    }
    h1 {
      font-family: 'Georgia', serif;
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #f8c8dc;
    }
    p {
      font-size: 1.1rem;
      color: #d1a7b9;
      margin-bottom: 25px;
    }
    button {
      background: #8b263e;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #ab3350;
    }
    input[type="password"] {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #8b263e;
      background: #231219;
      color: #fff;
      outline: none;
      margin-bottom: 15px;
      text-align: center;
    }
    #error-message {
      color: #ff6b6b;
      margin-top: 10px;
      display: none;
    }
    #loading-message {
      color: #ffd166;
      margin-top: 10px;
      display: none;
    }
    #passcode-preview-container {
      margin-top: 20px;
      display: none;
    }
    #passcode-preview-img {
      max-width: 200px;
      border-radius: 10px;
      border: 2px solid #8b263e;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Welcome -->
  <div id="screen-welcome" class="screen active">
    <h1>Welcome <span id="wife-name-placeholder">Akshitha</span></h1>
    <p>A special space created with and for my LOVE</p>
    <button onclick="navigateTo('screen-passcode')">Begin Experience →</button>
  </div>

  <!-- Screen 2: Passcode Verification -->
  <div id="screen-passcode" class="screen">
    <h1>Enter Passcode</h1>
    <p>Enter the secret password to decrypt your memory</p>
    <input type="password" id="passcode-input" placeholder="Passcode">
    <br>
    <button id="passcode-submit-btn">Unlock Experience</button>
    <div id="error-message"></div>
    <div id="loading-message">Decrypting memory...</div>
    <div id="passcode-preview-container">
      <img id="passcode-preview-img" src="" alt="Unlocked Preview">
    </div>
  </div>

  <!-- Screen 3: Calendar Animation -->
  <div id="screen-calendar" class="screen">
    <div id="calendar-container">
      <h2 id="cal-month-title">January</h2>
      <div id="cal-days-container" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px;"></div>
      <div id="active-page"></div>
    </div>
  </div>

  <!-- Screen 4: Message & Photo Reveal -->
  <div id="screen-message" class="screen">
    <h1>Surprise Revealed!</h1>
    <img id="reveal-photo1-img" src="" style="max-width: 300px; border-radius: 12px; margin-bottom: 20px;">
    <div id="gallery-container" style="display: flex; flex-wrap: wrap; gap: 10px; justify-center;"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox(event)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); align-items:center; justify-content:center;">
    <img id="lightbox-img" src="" style="max-width:90%; max-height:90%; border-radius:8px;">
  </div>

  <!-- =========================================================================
        JAVASCRIPT LOGIC
      ========================================================================= -->
  <script>
    const WIFE_NAME = "Akshitha";
    const TOTAL_PHOTOS = 50;
    const decryptedPhotos = [];

    function getCategoryForPhoto(index) {
      if (index % 3 === 0) return 'trips';
      if (index % 2 === 0) return 'favorites';
      return 'general';
    }

    document.getElementById('wife-name-placeholder').textContent = WIFE_NAME;

    function navigateTo(screenId) {
      document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
        s.style.display = 'none';
      });
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }

    const monthsList = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September"
    ];

    function renderMonthDays(monthIdx) {
      const container = document.getElementById('cal-days-container');
      container.innerHTML = '';
      
      const daysInMonth = monthIdx === 1 ? 28 : (monthIdx % 2 === 0 ? 31 : 30);
      
      for (let i = 1; i <= daysInMonth; i++) {
        const div = document.createElement('div');
        div.className = 'day-number';
        div.textContent = i;
        
        if (monthIdx === 8 && i === 24) {
          const circle = document.createElement('div');
          circle.className = 'highlight-circle';
          circle.id = 'date-highlight-circle';
          div.appendChild(circle);
        }
        container.appendChild(div);
      }
    }

    function startCalendarAnimation() {
      navigateTo('screen-calendar');
      const containerEl = document.getElementById('calendar-container');
      let currentMonthIndex = 0;

      function stepAnimation() {
        if (currentMonthIndex < monthsList.length - 1) {
          document.getElementById('cal-month-title').textContent = monthsList[currentMonthIndex];
          renderMonthDays(currentMonthIndex);

          setTimeout(() => {
            currentMonthIndex++;
            stepAnimation();
          }, 400);
        } else {
          document.getElementById('cal-month-title').textContent = "September";
          renderMonthDays(8);

          setTimeout(() => {
            navigateTo('screen-message');
          }, 1200);
        }
      }

      stepAnimation();
    }

    function decryptOpenSSLAES(encryptedArrayBuffer, password) {
      try {
        const u8 = new Uint8Array(encryptedArrayBuffer);
        const headerStr = String.fromCharCode.apply(null, u8.subarray(0, 8));
        
        let decBytes = null;

        if (headerStr === "Salted__") {
          const salt = CryptoJS.lib.WordArray.create(u8.subarray(8, 16));
          const ciphertext = CryptoJS.lib.WordArray.create(u8.subarray(16));

          try {
            const dKeys = CryptoJS.PBKDF2(password, salt, { keySize: 12, iterations: 10000, hasher: CryptoJS.algo.SHA256 });
            const key = CryptoJS.lib.WordArray.create(dKeys.words.slice(0, 8));
            const iv = CryptoJS.lib.WordArray.create(dKeys.words.slice(8, 12));
            const dec = CryptoJS.AES.decrypt({ ciphertext: ciphertext }, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
            if (dec.sigBytes > 0) decBytes = dec;
          } catch(e) {}

          if (!decBytes) {
            try {
              let passWordArray = CryptoJS.enc.Utf8.parse(password);
              let hasher = CryptoJS.algo.MD5.create();
              hasher.update(passWordArray);
              hasher.update(salt);
              let result = hasher.finalize();
              let dKey = result.clone();
              
              while (dKey.words.length < 12) {
                hasher = CryptoJS.algo.MD5.create();
                hasher.update(result);
                hasher.update(passWordArray);
                hasher.update(salt);
                result = hasher.finalize();
                dKey.concat(result);
              }
              
              const key = CryptoJS.lib.WordArray.create(dKey.words.slice(0, 8));
              const iv = CryptoJS.lib.WordArray.create(dKey.words.slice(8, 12));
              const dec = CryptoJS.AES.decrypt({ ciphertext: ciphertext }, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
              if (dec.sigBytes > 0) decBytes = dec;
            } catch(e) {}
          }
        }

        if (!decBytes) return null;

        const b64 = CryptoJS.enc.Base64.stringify(decBytes);
        
        if (b64 && b64.startsWith('/9j/')) {
          return 'data:image/jpeg;base64,' + b64;
        }

        return null;
      } catch (e) {
        return null;
      }
    }

    document.getElementById('passcode-submit-btn').addEventListener('click', handleUnlock);
    document.getElementById('passcode-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUnlock();
    });

    async function handleUnlock() {
      const passcode = document.getElementById('passcode-input').value.trim();
      const errorEl = document.getElementById('error-message');
      const loadingEl = document.getElementById('loading-message');
      const previewContainer = document.getElementById('passcode-preview-container');
      const previewImg = document.getElementById('passcode-preview-img');

      if (!passcode) return;

      errorEl.style.display = 'none';
      loadingEl.style.display = 'block';

      try {
        const testRes = await fetch('photos/photo1.enc');
        if (!testRes.ok) {
          errorEl.textContent = "Could not load photos/photo1.enc. Check file location.";
          errorEl.style.display = 'block';
          loadingEl.style.display = 'none';
          return;
        }
        
        const testBuffer = await testRes.arrayBuffer();
        const testDataUrl = decryptOpenSSLAES(testBuffer, passcode);

        if (!testDataUrl) {
          errorEl.textContent = "Incorrect passcode! Please try again.";
          errorEl.style.display = 'block';
          loadingEl.style.display = 'none';
          previewContainer.style.display = 'none';
          return;
        }

        previewImg.src = testDataUrl;
        previewContainer.style.display = 'block';
        document.getElementById('reveal-photo1-img').src = testDataUrl;

        decryptedPhotos.length = 0;
        decryptedPhotos.push({ id: 1, src: testDataUrl, category: getCategoryForPhoto(1) });

        const remainingFetches = [];
        for (let i = 2; i <= TOTAL_PHOTOS; i++) {
          remainingFetches.push(
            fetch(`photos/photo${i}.enc`)
              .then(res => res.ok ? res.arrayBuffer() : null)
              .then(buf => {
                if (!buf) return;
                const dataUrl = decryptOpenSSLAES(buf, passcode);
                if (dataUrl) {
                  decryptedPhotos.push({ id: i, src: dataUrl, category: getCategoryForPhoto(i) });
                }
              })
              .catch(() => {})
          );
        }

        await Promise.all(remainingFetches);
        decryptedPhotos.sort((a, b) => a.id - b.id);

        renderGallery('all');
        loadingEl.style.display = 'none';

        setTimeout(() => {
          startCalendarAnimation();
        }, 1000);

      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.textContent = "Error loading encrypted files.";
        errorEl.style.display = 'block';
      }
    }

    function renderGallery(filterCategory) {
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      decryptedPhotos.forEach(photo => {
        if (filterCategory === 'all' || photo.category === filterCategory) {
          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.onclick = () => openLightbox(photo.src);

          const img = document.createElement('img');
          img.src = photo.src;
          img.alt = `Memory ${photo.id}`;
          img.style.maxWidth = '150px';
          img.style.borderRadius = '8px';

          item.appendChild(img);
          container.appendChild(item);
        }
      });
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox(event) {
      document.getElementById('lightbox').style.display = 'none';
    }
  </script>
</body>
</html>
